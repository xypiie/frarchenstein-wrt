name: source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - run: bash -n build.sh start.sh review-kernel.sh builder/bootstrap.sh builder/job.sh builder/lab-client.sh recipes/openwrt/build.sh recipes/arch/PKGBUILD
      - run: sh -n src/arch src/pacman
